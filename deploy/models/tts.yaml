# OmniVoice TTS — served by vllm-omni/KServe.
# OpenAI-compatible endpoint: POST /v1/audio/speech
# Model id (OpenAI `model` field) == this InferenceService name: omnivoice
# Apply with:  oc apply -f tts.yaml -n <namespace>
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: omnivoice
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    security.opendatahub.io/enable-auth: "false"
    openshift.io/display-name: omnivoice
    opendatahub.io/model-type: generative
spec:
  predictor:
    automountServiceAccountToken: false
    minReplicas: 1
    maxReplicas: 1
    deploymentStrategy:
      type: Recreate
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-omni-cuda
      storageUri: hf://k2-fsa/OmniVoice
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: 8Gi
          nvidia.com/gpu: "1"
