# vllm-omni (omni-modality vLLM) ServingRuntime for KServe.
# Used by the OmniVoice TTS InferenceService.
# Apply with:  oc apply -f vllm-omni-serving-runtime.yaml -n <namespace>
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-omni-cuda
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    opendatahub.io/apiProtocol: REST
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
    openshift.io/display-name: vllm-omni NVIDIA GPU ServingRuntime (KServe)
spec:
  multiModel: false
  supportedModelFormats:
    - name: vLLM
      autoSelect: true
  containers:
    - name: kserve-container
      # vllm-omni community image. Replace with a productised RHOAI image when
      # available, or build your own from https://github.com/vllm-project/vllm-omni
      image: quay.io/vllm/automation-vllm-omni:0.26.0_rhaiv.0
      command:
        - python
        - "-m"
        - vllm.entrypoints.openai.api_server
      args:
        - "--port=8080"
        - "--model=/mnt/models"
        - "--served-model-name={{.Name}}"
        - "--trust-remote-code"
        - "--omni"
      env:
        - name: HF_HOME
          value: /tmp/hf_home
      ports:
        - containerPort: 8080
          protocol: TCP
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
